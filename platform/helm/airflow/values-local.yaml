createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false

executor: KubernetesExecutor

triggerer:
  enabled: false

postgresql:
  enabled: false

data:
  metadataConnection:
    protocol: postgresql
    host: airflow-postgresql.db-services.svc.cluster.local
    port: 5432
    user: airflow
    db: airflow

statsd:
  enabled: false
