apiVersion: v1
kind: PersistentVolume
metadata:
  name: gitsync-shared-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: gitsync-shared
    name: shared-repos
  hostPath:
    path: /mnt/git
    type: Directory
