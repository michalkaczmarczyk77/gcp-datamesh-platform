apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-repos
  namespace: gitsync-shared
spec:
  storageClassName: ""
  volumeName: gitsync-shared-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Uncomment and replace if your cluster requires a specific RWX StorageClass:
  # storageClassName: nfs-client

