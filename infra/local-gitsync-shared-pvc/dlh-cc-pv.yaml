apiVersion: v1
kind: PersistentVolume
metadata:
  name: dlh-cc-git-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: dlh-cc
    name: dlh-cc-git-repo
  hostPath:
    path: /mnt/git/
    type: Directory
